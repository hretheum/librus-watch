[project]
name = "librus-watch"
version = "0.1.0"
description = "Watches Librus Synergia and alerts parents about deviations from the normal school day (earlier gathering, things to bring, cancellations)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "hretheum" }]
keywords = ["librus", "synergia", "szkoła", "powiadomienia", "telegram"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "librus-apix==1.6.0",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "openai>=1.50,<3",
    "apprise>=1.9,<3",
]

[project.urls]
Homepage = "https://github.com/hretheum/librus-watch"
Issues = "https://github.com/hretheum/librus-watch/issues"
Roadmap = "https://github.com/hretheum/librus-watch/blob/main/docs/roadmap.md"

[project.scripts]
librus-watch = "librus_watch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-requests",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/librus_watch"]

[tool.uv]
# Łańcuch dostaw: nie rozwiązujemy wersji opublikowanych w ostatnich dniach.
exclude-newer = "2026-10-30T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "unit: test jednostkowy (tests/unit, nadawany automatycznie)",
    "integration: kilka modułów razem, prawdziwa baza, fałszywy Librus i model (tests/integration)",
    "e2e: cały cykl przez CLI na lokalnych atrapach Librusa, modelu i Apprise (tests/e2e)",
    "llm: test na żywym endpoincie LLM (wymaga LLM_* w env)",
    "live: test na prawdziwym koncie Librusa (ręcznie, wymaga sekretów)",
]
addopts = "-m 'not llm and not live' --cov=librus_watch --cov-branch --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["librus_watch"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "D"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607", "S608", "D"]
"tests/fixtures/eval_texts.py" = ["E501"]
"src/librus_watch/admin_page.py" = ["E501"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["librus_apix.*", "apprise.*"]
ignore_missing_imports = true
